name: Deploy to CapRover

on:
  push:
    branches: [Development, Production]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'Production' && 'production' || 'preview' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Set vault name
        run: |
          PROJECT_NAME="${{ github.event.repository.name }}"
          ENVIRONMENT="${{ github.ref_name == 'Production' && 'prod' || 'dev' }}"
          echo "OP_VAULT=${PROJECT_NAME}-${ENVIRONMENT}" >> $GITHUB_ENV

      - name: Load secrets from 1Password
        run: |
          op inject -i .env.template -o .env
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Load CapRover credentials
        run: |
          echo "CAPROVER_URL=$(op read 'op://${{ env.OP_VAULT }}/CapRover/url')" >> $GITHUB_ENV
          echo "CAPROVER_APP_TOKEN=$(op read 'op://${{ env.OP_VAULT }}/CapRover/app_token')" >> $GITHUB_ENV
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Create deployment tarball
        run: |
          tar -czf deploy.tar.gz captain-definition package.json package-lock.json dist/

      - name: Deploy to CapRover
        run: |
          curl -X POST https://$CAPROVER_URL/api/v2/user/apps/webhooks/triggerbuild \
            -H "x-captain-app-token: $CAPROVER_APP_TOKEN" \
            -F "sourceFile=@deploy.tar.gz"
