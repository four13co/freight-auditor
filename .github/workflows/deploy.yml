name: Deploy to CapRover

on:
  push:
    branches: [Development, Production]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Set vault name
        run: |
          PROJECT_NAME="${{ github.event.repository.name }}"
          ENVIRONMENT="${{ github.ref_name == 'Production' && 'prod' || 'dev' }}"
          echo "OP_VAULT=${PROJECT_NAME}-${ENVIRONMENT}" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Create deployment tarball
        run: |
          tar -czf deploy.tar.gz captain-definition package.json package-lock.json dist/

      - name: Install CapRover CLI
        run: npm install -g caprover

      # freight-auditor has one CapRover app today (no separate prod app yet),
      # so both branches deploy to the same --appName. Split this per-environment
      # (like OP_VAULT above) once a production app exists.
      - name: Deploy to CapRover
        run: |
          op run --env-file=.env.caprover -- caprover deploy \
            --caproverUrl "https://$CAPROVER_URL" \
            --appToken "$CAPROVER_APP_TOKEN" \
            --appName "freight-auditor" \
            --tarFile deploy.tar.gz
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
