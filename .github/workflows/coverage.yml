name: Coverage Gate

on:
  pull_request:
    branches: [Development]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Default-suite scope only (vitest.config.ts excludes test/db/**) — this is what
      # runs without a live Postgres, so it's what CI can gate deterministically on
      # every PR (86e2u72u2). DB-touching tests are exercised separately, not counted
      # toward this floor.
      - name: Run coverage gate
        run: npm run test:coverage
