name: Deploy to CapRover

on:
  push:
    branches: [Development, Production]
  workflow_dispatch:

# Serializes runs on the same branch so overlapping deploys queue instead of
# racing (86e2urk0k). cancel-in-progress: false, not true -- a deploy that's
# already migrated/deployed must run to completion (including its rollback
# path), not be killed mid-way; queuing is what's needed, not cancellation.
# This alone doesn't guarantee GitHub's queue preserves commit order, which
# is why the "Advance last-good tag" step below also has its own independent
# ancestor check (belt-and-suspenders, not a substitute for this).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 86e2v1qrn: none of this workflow's jobs bounded their runtime, and
  # cancel-in-progress: false means a hung step blocks every subsequent
  # deploy indefinitely -- observed live: post-deployment's rollback step ran
  # 2h12m (run 31973373618) holding the concurrency group the entire time,
  # extending the 86e2v0acm outage by over two hours before a human cancelled
  # it manually. Healthy runs on this repo complete each job in ~1-2 minutes
  # (confirmed against recent successful runs); 15-20m leaves large headroom
  # without approaching GitHub's unhelpfully-long 6h default.
  migrate-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Set vault name
        run: |
          PROJECT_NAME="${{ github.event.repository.name }}"
          ENVIRONMENT="${{ github.ref_name == 'Production' && 'prod' || 'dev' }}"
          echo "OP_VAULT=${PROJECT_NAME}-${ENVIRONMENT}" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      # freight-auditor-dev's DATABASE_URL is a dedicated dev Neon instance (not shared/
      # production), so CI is allowed to migrate it automatically. Production has no
      # DATABASE_URL secret yet and gets no override — the guard stays live there.
      #
      # 86e2uut65: npm run seed:dev runs in this SAME op run block (not a separate
      # step) so it reuses the DATABASE_URL already resolved here rather than
      # duplicating secret wiring. Gated on Development exactly like
      # ALLOW_PROTECTED_DB_HOST above -- seed:dev inserts a fixture client_admin
      # user (dev-dashboard@example.com) whose UUID pair alone is treated as
      # access under the current dev-stub auth model (86e2urn3e); running this
      # on Production would be a backdoor account, not a convenience. The
      # script itself is ON CONFLICT DO NOTHING on all three inserts, so a
      # second consecutive Development deploy re-running it is a no-op, not a
      # duplicate-row risk.
      #
      # 86e2v2dh1: npm run seed:criteria runs unconditionally (unlike seed:dev
      # above), in both Development and Production -- it's canonical reference
      # data (criterion/rule/rule_version rows for STANDARD_RUBRIC +
      # CONTRACT_RUBRIC), not a per-environment fixture, and criterionKey
      # resolution needs to work everywhere the engine runs. It runs before the
      # SEED_DEV_ON_DEPLOY block so dev-fixture seeding never masks a failure
      # here. Production has no DATABASE_URL secret yet (see comment above), so
      # this step doesn't reach Production today either -- unconditional here is
      # still correct: it means the seed runs the moment Production gets a
      # DATABASE_URL, with no second workflow change required.
      - name: Run database migrations and seed dev tenant
        run: |
          op run --env-file=.env.migrate -- bash -c '
            set -euo pipefail
            node scripts/guard-protected-db.mjs
            npm run migrate up
            npm run seed:criteria
            if [ "$SEED_DEV_ON_DEPLOY" = "1" ]; then
              npm run seed:dev
            fi
          '
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ALLOW_PROTECTED_DB_HOST: ${{ github.ref_name == 'Development' && '1' || '' }}
          SEED_DEV_ON_DEPLOY: ${{ github.ref_name == 'Development' && '1' || '' }}

  deploy:
    needs: migrate-database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Set vault name
        run: |
          PROJECT_NAME="${{ github.event.repository.name }}"
          ENVIRONMENT="${{ github.ref_name == 'Production' && 'prod' || 'dev' }}"
          echo "OP_VAULT=${PROJECT_NAME}-${ENVIRONMENT}" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Write build identifier
        run: echo "${{ github.sha }}" > dist/server/BUILD_SHA

      # 86e2v07n3: the dashboard has never been deployed -- `npm run build` is
      # backend-only (tsc), so web/dist never existed at package time and the
      # tarball below never shipped it, even though src/server/app.ts has been
      # ready to serve it since 86e2u7j01. Built pre-package here, never inside
      # the Docker image (npm ci --production there installs prod deps only).
      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Build web
        run: npm --prefix web run build

      # 86e2v0acm: DATABASE_URL (and SESSION_SECRET) were never wired into the
      # running container -- deploy.yml only ever resolved DATABASE_URL inside the
      # migrate-database job, a CI subprocess that exits, and CapRover's own app
      # config was never the source of runtime env here (confirmed: no envVars/
      # setEnv anywhere in this file). This resolves .env from 1Password IN THIS CI
      # JOB and ships the RESOLVED file in the tarball -- a deliberate, informed
      # exception to "never write secrets to disk" for exactly the carve-out
      # CLAUDE.md names ("the only place a plaintext secret may legitimately sit on
      # disk is a production server, and the deployment system is responsible for
      # putting it there"). Mirrors the working pattern in tranzetta-portal's
      # deploy-development.yml (Dockerfile there: "runtime env comes from the .env
      # the deploy workflow bakes into the image -- CapRover dashboard env is NOT
      # the source"). The runner's own filesystem is the only place this transits;
      # never printed, never $GITHUB_ENV, never persisted past this job.
      #
      # `.env.template`'s ${OP_VAULT} is NOT expanded by `op inject` itself (unlike
      # `op run --env-file`, which does expand it) -- confirmed against
      # tranzetta-portal's ops/env-map.json, which hardcodes a literal vault name
      # per environment rather than relying on op inject to substitute a variable.
      # So the substitution has to happen before op inject sees the template.
      - name: Resolve runtime .env from 1Password
        run: |
          sed "s|\${OP_VAULT}|$OP_VAULT|g" .env.template > .env.tpl
          op inject -i .env.tpl -o .env
          rm .env.tpl
          if grep -q 'op://' .env; then
            echo "::error::.env still has unresolved op:// references after injection"
            exit 1
          fi
          echo "Resolved $(wc -l < .env) variables into .env"
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      # The tarball IS the entire Docker build context CapRover sees — nothing else
      # from the repo reaches the builder. Dockerfile was missing here, so
      # captain-definition's "./Dockerfile" resolved to nothing and every server-side
      # build failed, while `caprover deploy` still exited 0 (it confirms the upload,
      # not the build). That's what kept CI green over an app that never ran.
      # web/dist/ was the identical class of omission (86e2v07n3) -- verify with the
      # tar -tzf listing below, don't just assume the tar command is complete.
      #
      # .dockerignore is NOT consulted here -- CapRover builds from exactly what
      # this tarball contains, nothing more (that's why `dist` being listed in
      # .dockerignore has never stopped `COPY dist ./dist` from working). This
      # explicit include-list is the only effective filter; .env must be named
      # here or the COPY .env step below silently has nothing to copy.
      - name: Create deployment tarball
        run: |
          tar -czf deploy.tar.gz Dockerfile captain-definition package.json package-lock.json dist/ web/dist/ .env
          tar -tzf deploy.tar.gz
          rm .env

      - name: Install CapRover CLI
        run: npm install -g caprover

      # The `bash -c '...'` wrapper is load-bearing, not stylistic: when caprover
      # (a non-shell binary) is op run's direct trailing command, the resolved env
      # vars don't reach its process image and --caproverUrl/--appToken end up
      # empty even though `op run -- bash -c 'echo $SRC_CAPROVER_URL'` resolves
      # them correctly. Routing through an intermediate shell fixes it.
      #
      # app_name comes from 1Password (CapRover/app_name), not a hardcoded literal here —
      # the actual app is named freight-auditor-dev, not freight-auditor, and nothing about
      # the CapRover target should live in this file rather than the vault.
      - name: Deploy to CapRover
        run: |
          op run --env-file=.env.caprover -- bash -c '
            set -o pipefail
            caprover deploy \
              --caproverUrl "https://$SRC_CAPROVER_URL" \
              --appToken "$SRC_CAPROVER_APP_TOKEN" \
              --appName "$SRC_CAPROVER_APP_NAME" \
              --tarFile deploy.tar.gz 2>&1 | tee deploy.log
          '
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      # The CLI streams CapRover's server-side build output; keeping it as an artifact
      # means the next build failure is diagnosable from CI instead of requiring
      # someone to open the CapRover dashboard and read Version History by hand.
      - name: Upload deployment log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caprover-deploy-log
          path: deploy.log
          retention-days: 30
          # If `op run` itself fails (bad reference, expired token) the inner shell
          # never runs and deploy.log is never created. Without this, upload-artifact@v4
          # fails on the missing path and masks the real error with a second one.
          if-no-files-found: ignore

  post-deployment:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Set vault name
        run: |
          PROJECT_NAME="${{ github.event.repository.name }}"
          ENVIRONMENT="${{ github.ref_name == 'Production' && 'prod' || 'dev' }}"
          echo "OP_VAULT=${PROJECT_NAME}-${ENVIRONMENT}" >> $GITHUB_ENV
          echo "LAST_GOOD_TAG=last-good-${ENVIRONMENT}" >> $GITHUB_ENV

      - name: Poll /health for the new revision
        id: healthcheck
        run: |
          op run --env-file=.env.post-deploy -- node scripts/post-deploy-healthcheck.mjs
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}

      # 86e2v0ked: scripts/rollback-deploy.mjs invokes the caprover CLI directly, but each
      # job runs on a fresh runner -- the deploy job's own "Install CapRover CLI" step does
      # not carry over. Confirmed live (run 31965676397): the health check correctly failed
      # and triggered this step, which then failed itself with "spawn caprover ENOENT" --
      # the rollback safety net was untested until the first real failure exercised it.
      - name: Install CapRover CLI
        if: failure() && steps.healthcheck.outcome == 'failure'
        run: npm install -g caprover

      # 86e2v1qrn: this step ran 2h12m unbounded (run 31973373618, cancelled
      # manually) holding the deploy-${{ github.ref }} concurrency group the
      # whole time -- PR #73's fix for the live database:unreachable outage
      # sat queued and couldn't deploy until a human intervened. A dedicated,
      # tighter step-level bound (rather than relying on the job-level one
      # above) makes it unambiguous in the logs that THIS step is what hung.
      - name: Roll back to the last known-good revision
        if: failure() && steps.healthcheck.outcome == 'failure'
        timeout-minutes: 10
        run: op run --env-file=.env.caprover -- node scripts/rollback-deploy.mjs
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      # Gated on success() rather than always() — after a failing health-check, this step
      # must NOT run (regardless of whether the rollback above succeeded), so the overall
      # job stays failed and humans are alerted even though service was restored.
      #
      # Runs via the testable script, not inline bash (86e2urk0k) -- the ancestor
      # check that prevents this tag from ever moving backward needs to be provable
      # against a real git history, which inline bash in a workflow file isn't.
      - name: Advance last-good tag
        if: success()
        run: node scripts/advance-last-good-tag.mjs
        env:
          GITHUB_SHA: ${{ github.sha }}
