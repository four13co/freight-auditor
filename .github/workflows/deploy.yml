name: Deploy to CapRover

on:
  push:
    branches: [Development, Production]
  workflow_dispatch:

# Serializes runs on the same branch so overlapping deploys queue instead of
# racing (86e2urk0k). cancel-in-progress: false, not true -- a deploy that's
# already migrated/deployed must run to completion (including its rollback
# path), not be killed mid-way; queuing is what's needed, not cancellation.
# This alone doesn't guarantee GitHub's queue preserves commit order, which
# is why the "Advance last-good tag" step below also has its own independent
# ancestor check (belt-and-suspenders, not a substitute for this).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Set vault name
        run: |
          PROJECT_NAME="${{ github.event.repository.name }}"
          ENVIRONMENT="${{ github.ref_name == 'Production' && 'prod' || 'dev' }}"
          echo "OP_VAULT=${PROJECT_NAME}-${ENVIRONMENT}" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      # freight-auditor-dev's DATABASE_URL is a dedicated dev Neon instance (not shared/
      # production), so CI is allowed to migrate it automatically. Production has no
      # DATABASE_URL secret yet and gets no override — the guard stays live there.
      - name: Run database migrations
        run: |
          op run --env-file=.env.migrate -- bash -c '
            set -euo pipefail
            node scripts/guard-protected-db.mjs
            npm run migrate up
          '
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ALLOW_PROTECTED_DB_HOST: ${{ github.ref_name == 'Development' && '1' || '' }}

  deploy:
    needs: migrate-database
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Set vault name
        run: |
          PROJECT_NAME="${{ github.event.repository.name }}"
          ENVIRONMENT="${{ github.ref_name == 'Production' && 'prod' || 'dev' }}"
          echo "OP_VAULT=${PROJECT_NAME}-${ENVIRONMENT}" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Write build identifier
        run: echo "${{ github.sha }}" > dist/server/BUILD_SHA

      # 86e2v07n3: the dashboard has never been deployed -- `npm run build` is
      # backend-only (tsc), so web/dist never existed at package time and the
      # tarball below never shipped it, even though src/server/app.ts has been
      # ready to serve it since 86e2u7j01. Built pre-package here, never inside
      # the Docker image (npm ci --production there installs prod deps only).
      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Build web
        run: npm --prefix web run build

      # The tarball IS the entire Docker build context CapRover sees — nothing else
      # from the repo reaches the builder. Dockerfile was missing here, so
      # captain-definition's "./Dockerfile" resolved to nothing and every server-side
      # build failed, while `caprover deploy` still exited 0 (it confirms the upload,
      # not the build). That's what kept CI green over an app that never ran.
      # web/dist/ was the identical class of omission (86e2v07n3) -- verify with the
      # tar -tzf listing below, don't just assume the tar command is complete.
      - name: Create deployment tarball
        run: |
          tar -czf deploy.tar.gz Dockerfile captain-definition package.json package-lock.json dist/ web/dist/
          tar -tzf deploy.tar.gz

      - name: Install CapRover CLI
        run: npm install -g caprover

      # The `bash -c '...'` wrapper is load-bearing, not stylistic: when caprover
      # (a non-shell binary) is op run's direct trailing command, the resolved env
      # vars don't reach its process image and --caproverUrl/--appToken end up
      # empty even though `op run -- bash -c 'echo $SRC_CAPROVER_URL'` resolves
      # them correctly. Routing through an intermediate shell fixes it.
      #
      # app_name comes from 1Password (CapRover/app_name), not a hardcoded literal here —
      # the actual app is named freight-auditor-dev, not freight-auditor, and nothing about
      # the CapRover target should live in this file rather than the vault.
      - name: Deploy to CapRover
        run: |
          op run --env-file=.env.caprover -- bash -c '
            set -o pipefail
            caprover deploy \
              --caproverUrl "https://$SRC_CAPROVER_URL" \
              --appToken "$SRC_CAPROVER_APP_TOKEN" \
              --appName "$SRC_CAPROVER_APP_NAME" \
              --tarFile deploy.tar.gz 2>&1 | tee deploy.log
          '
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      # The CLI streams CapRover's server-side build output; keeping it as an artifact
      # means the next build failure is diagnosable from CI instead of requiring
      # someone to open the CapRover dashboard and read Version History by hand.
      - name: Upload deployment log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caprover-deploy-log
          path: deploy.log
          retention-days: 30
          # If `op run` itself fails (bad reference, expired token) the inner shell
          # never runs and deploy.log is never created. Without this, upload-artifact@v4
          # fails on the missing path and masks the real error with a second one.
          if-no-files-found: ignore

  post-deployment:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Set vault name
        run: |
          PROJECT_NAME="${{ github.event.repository.name }}"
          ENVIRONMENT="${{ github.ref_name == 'Production' && 'prod' || 'dev' }}"
          echo "OP_VAULT=${PROJECT_NAME}-${ENVIRONMENT}" >> $GITHUB_ENV
          echo "LAST_GOOD_TAG=last-good-${ENVIRONMENT}" >> $GITHUB_ENV

      - name: Poll /health for the new revision
        id: healthcheck
        run: |
          op run --env-file=.env.post-deploy -- node scripts/post-deploy-healthcheck.mjs
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}

      - name: Roll back to the last known-good revision
        if: failure() && steps.healthcheck.outcome == 'failure'
        run: op run --env-file=.env.caprover -- node scripts/rollback-deploy.mjs
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      # Gated on success() rather than always() — after a failing health-check, this step
      # must NOT run (regardless of whether the rollback above succeeded), so the overall
      # job stays failed and humans are alerted even though service was restored.
      #
      # Runs via the testable script, not inline bash (86e2urk0k) -- the ancestor
      # check that prevents this tag from ever moving backward needs to be provable
      # against a real git history, which inline bash in a workflow file isn't.
      - name: Advance last-good tag
        if: success()
        run: node scripts/advance-last-good-tag.mjs
        env:
          GITHUB_SHA: ${{ github.sha }}
