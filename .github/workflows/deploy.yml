name: Deploy to CapRover

on:
  push:
    branches: [Development, Production]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'Production' && 'production' || 'preview' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Set vault name
        run: |
          PROJECT_NAME="${{ github.event.repository.name }}"
          ENVIRONMENT="${{ github.ref_name == 'Production' && 'prod' || 'dev' }}"
          echo "OP_VAULT=${PROJECT_NAME}-${ENVIRONMENT}" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Create deployment tarball
        run: |
          tar -czf deploy.tar.gz captain-definition package.json package-lock.json dist/

      - name: Deploy to CapRover
        run: |
          op run --env-file=.env.caprover -- bash -c '
            set -euo pipefail
            response="$(curl -sS --fail-with-body -X POST "https://$CAPROVER_URL/api/v2/user/apps/webhooks/triggerbuild" \
              -H "x-captain-app-token: $CAPROVER_APP_TOKEN" \
              -F "sourceFile=@deploy.tar.gz")"
            echo "$response"
            # CapRover always responds HTTP 200 even on failure; the real
            # success/error signal is the JSON body'"'"'s status field
            # (100 = ok, per CapRover'"'"'s API; anything else, e.g. 1106
            # "Auth token corrupted", is a failed deploy that must not go green).
            status="$(echo "$response" | jq -r ".status // \"missing\"")"
            if [ "$status" != "100" ]; then
              echo "::error::CapRover deploy failed (status=$status): $response"
              exit 1
            fi
          '
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
