name: CI

# 86e2uut65: `push` on Development re-runs every job against the actual merge
# commit, not just each PR branch in isolation. This is the gate that would
# have caught PRs #51+#52 shipping a dashboard where every data call 401'd --
# #51's frontend omitted an auth header, #52's preHandler required it, and
# each PR's own suite was green because CI never ran them together. The same
# shape recurred with #61+#62+#63 (all GitHub-reported MERGEABLE in isolation,
# but conflicting/typecheck-broken once actually combined). No concurrency
# group added here -- deploy.yml already owns `deploy-${{ github.ref }}` for
# the deploy pipeline, and this workflow's own runs don't need to serialize
# against each other or against deploy.yml's.
on:
  pull_request:
    branches: [Development]
  push:
    branches: [Development]

jobs:
  # 86e2v1qrn: deploy.yml's unbounded rollback step hung 2h12m and blocked
  # every subsequent deploy via its concurrency group. This workflow has no
  # concurrency group, so a hang here doesn't block other CI runs the same
  # way, but an unbounded job is still worth bounding rather than relying on
  # GitHub's 6h default. Sized against observed healthy runtimes with large
  # headroom -- lint/typecheck run in well under a minute; db-tests and the
  # web/web-fullstack Playwright jobs (browser install + e2e) run longer.
  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run migrate -- up

      # test/db/** runs with fileParallelism: false (shared schema, see
      # vitest.db.config.ts) -- do not parallelize this job or split it into
      # a matrix, it will produce cross-test contention that looks like
      # flakiness (86e2uhn2x rabbit hole).
      - name: Run DB test suite
        run: npm run test:db

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

  # web/ has its own package.json, tsconfig, and vitest config (component
  # tests only -- no live backend needed). Kept as a separate job/config
  # rather than folded into the root suite or coverage gate, mirroring the
  # db-tests precedent: the root coverage gate's denominator must stay
  # scoped to files it can deterministically exercise (86e2u72u2's rabbit
  # hole), and web/src/** would otherwise show up there at low coverage.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Run web typecheck
        run: npm run web:typecheck

      - name: Run web component tests
        run: npm run web:test

      # playwright.config.ts's webServer runs `vite preview`, which serves
      # web/dist/ -- gitignored and never built otherwise. Without this step
      # the e2e job hangs until config.webServer's timeout and fails.
      - name: Build web
        run: npm --prefix web run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Run web e2e (Playwright)
        run: npm run web:e2e

      - name: Upload dashboard render (perceptual review artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-render
          path: web/test-results/
          retention-days: 14

  # 86e2uv4p0: browser -> real Fastify server -> real Postgres, no page.route
  # mocking anywhere in this suite (unlike the `web` job's dashboard.spec.ts,
  # which mocks every API call). This is the job that would have caught PRs
  # #51+#52 shipping a dashboard where every data call 401'd -- both PRs were
  # green because a mocked API returns 200 regardless of what headers the
  # client sends. Separate job (not folded into `web`) because it needs the
  # db-tests job's Postgres service and a migrate+seed step the `web` job has
  # no reason to carry.
  web-fullstack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Apply migrations
        run: npm run migrate -- up

      - name: Seed dev tenant
        run: npm run seed:dev

      - name: Seed full-stack e2e fixture
        run: npm run seed:e2e-fullstack-fixture

      # The suite's webServer starts the real server, which only serves the
      # frontend if web/dist exists (src/server/app.ts tolerates it being
      # absent -- a running server with no UI, not a loud error). Must build
      # BEFORE Playwright starts; the webServer.command itself runs under a
      # startup timeout, so build prep does not belong there.
      #
      # 86e2v1bdj: vite build bakes import.meta.env.DEV to false
      # unconditionally, so without this explicit opt-in the built bundle
      # sends no auth headers at all -- every page-driven /api/* call would
      # 401 against this job's DEV_AUTH_HEADERS=1 server (a real deploy build
      # never sets this var, so this does not reopen 86e2v24uf's
      # production-exposure fix).
      - name: Build web
        run: npm --prefix web run build
        env:
          VITE_DEV_AUTH_HEADERS: '1'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Run web full-stack e2e (Playwright, real server + real Postgres)
        run: npm run web:e2e:fullstack

      - name: Upload full-stack e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-fullstack-e2e
          path: web/test-results/
          retention-days: 14
